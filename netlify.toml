# Netlify detecta Next.js automáticamente (runtime de Next.js / OpenNext).
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# Funciones propias de Netlify (la tarea diaria de mantenimiento)
[functions]
  directory = "netlify/functions"

# Adaptador oficial de Next.js para Netlify (rutas dinámicas, API, imágenes).
# Sin esto Netlify publica .next como archivos estáticos y la tienda da 404.
[[plugins]]
  package = "@netlify/plugin-nextjs"
